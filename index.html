<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WMS prototype</title>
<link rel="stylesheet" href="assets/wms.css">
<style>
  /* Device preview: every page runs inside a phone or laptop (left), with the prototype controls beside it (right). */
  body { min-height: 100vh; }
  .dp-head { background: var(--brand); color: #fff; }
  .dp-head-in { max-width: 1440px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
  .dp-head .logo-text small { color: #c5d5ea; }
  .dp-head .tag { margin-left: auto; font-size: 13px; color: #c5d5ea; }
  .stage { max-width: 1440px; width: calc(100% - 48px); margin: 24px auto; padding: 28px; display: flex; gap: 32px; align-items: flex-start;
    background: #fff; border: 1.5px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); }
  .device-col { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  #device { max-width: 100%; display: flex; justify-content: center; }
  .device-label { display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; text-align: center; }
  .device-label strong { font-size: 20px; color: var(--brand); }
  .device-label span { font-size: 13px; color: var(--muted); }

  /* phone */
  .phone { width: 414px; max-width: 100%; background: #0f1720; border-radius: 48px; padding: 12px; box-shadow: 0 24px 50px rgba(11, 30, 55, .35); }
  .phone .screen { background: var(--page); border-radius: 36px; overflow: hidden; position: relative; }
  .status { height: 34px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 13px; font-weight: 600; position: relative; }
  .status .notch { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: 110px; height: 24px; background: #0f1720; border-radius: 14px; }
  .status .icons { display: inline-flex; gap: 6px; align-items: center; }
  .phone iframe { display: block; width: 390px; max-width: 100%; height: 760px; border: 0; background: var(--page); }
  .home { height: 26px; background: #fff; display: flex; align-items: center; justify-content: center; border-top: 1px solid var(--line-2); }
  .home span { width: 120px; height: 5px; border-radius: 3px; background: #1a2430; }

  /* laptop: the page renders at 1280 × 800 and is scaled to fit */
  .laptop { display: flex; flex-direction: column; align-items: center; }
  .lid { background: #0f1720; border-radius: 18px 18px 6px 6px; padding: 22px 14px 14px; position: relative; box-shadow: 0 24px 50px rgba(11, 30, 55, .3); }
  .lid .cam { position: absolute; top: 8px; left: 50%; width: 7px; height: 7px; margin-left: -3px; border-radius: 50%; background: #3a4654; }
  .lscreen { overflow: hidden; background: var(--page); border-radius: 4px; }
  .lscreen-in { width: 1280px; height: 800px; transform-origin: 0 0; }
  .laptop iframe { display: block; width: 1280px; height: 800px; border: 0; background: var(--page); }
  .base { height: 16px; background: linear-gradient(#cfd8e3, #a9b6c4); border-radius: 0 0 14px 14px; position: relative; }
  .base::after { content: ""; position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 120px; height: 6px; background: #94a3b4; border-radius: 0 0 8px 8px; }

  /* controls panel */
  .panel { flex: 0 0 360px; }
  .stage.is-laptop .panel { flex-basis: 290px; }
  .panel h2 { margin-bottom: 4px; }
  .panel section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 16px; }
  .panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .panel .btns { display: flex; flex-direction: column; gap: 8px; }
  .panel .btns .btn { justify-content: flex-start; text-align: left; width: 100%; }
  .panel .btns .btn[aria-pressed="true"] { background: var(--brand-tint); border-color: var(--brand-2); color: var(--brand); }
  .panel .btns .btn[aria-pressed="true"]::after { content: "On"; margin-left: auto; font-size: 12px; background: var(--brand-2); color: #fff; padding: 1px 8px; border-radius: 999px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
  .seg button { min-height: 46px; border: none; background: #fff; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .seg button + button { border-left: 1.5px solid var(--line-strong); }
  .seg button[aria-pressed="true"] { background: var(--brand-2); color: #fff; }
  .persona { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .persona .btn { flex-direction: column; align-items: flex-start; gap: 0; padding: 8px 10px; text-align: left; }
  .persona .btn small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .persona .btn[aria-pressed="true"] { background: var(--brand-tint); border: 2px solid var(--brand-2); color: var(--brand); }
  .screen-name { font-weight: 700; color: var(--brand); text-transform: none; letter-spacing: 0; font-size: 15px; }

  @media (max-width: 900px) {
    .stage { flex-direction: column; width: 100%; margin: 0; border-radius: 0; border: none; padding: 12px; gap: 16px; }
    .panel, .stage.is-laptop .panel { flex-basis: auto; width: 100%; }
    .device-col { width: 100%; }
    .phone { padding: 8px; border-radius: 36px; }
    .phone iframe { width: 100%; height: 72vh; }
  }
</style>
</head>
<body data-preview>
<header class="dp-head"><div class="dp-head-in">
  <span id="mark"></span><span class="logo-text"><strong>WMS</strong><small>Ambulance Workforce · prototype preview</small></span>
  <span class="tag">Prototype</span>
</div></header>

<main class="stage" id="main">
  <div class="device-col">
    <div class="device-label" aria-live="polite"><strong id="dev-title">Mobile view</strong><span id="dev-sub"></span></div>
    <div id="device"></div>
  </div>

  <aside class="panel card" aria-labelledby="pc-h">
    <h2 id="pc-h">Prototype controls</h2>
    <p class="hint">Not part of the app. Everything inside the device is the real design.</p>

    <section aria-labelledby="dv-h">
      <h3 id="dv-h">Toggle view</h3>
      <div class="seg" role="group" aria-label="Device">
        <button type="button" data-view="phone" id="v-phone"></button>
        <button type="button" data-view="laptop" id="v-laptop"></button>
      </div>
    </section>

    <section aria-labelledby="as-h">
      <h3 id="as-h">View as</h3>
      <div class="persona" id="persona"></div>
    </section>

    <section aria-labelledby="scr-h">
      <h3 id="scr-h">This screen: <span class="screen-name" id="scr"></span></h3>
      <div class="btns" id="page-ctrls"></div>
    </section>

    <section aria-labelledby="gen-h">
      <h3 id="gen-h">Any screen</h3>
      <div class="btns">
        <button class="btn" type="button" id="idle">Simulate 15 min idle (NFR-11)</button>
        <button class="btn" type="button" id="reset">Reset prototype data</button>
        <button class="btn" type="button" id="logout">Log out</button>
      </div>
    </section>
  </aside>
</main>

<script src="assets/wms.js"></script>
<script>
(function () {
  if (window.self !== window.top) { location.replace('login.html'); return; }   // never nest the preview
  var W = WMS;
  document.getElementById('mark').innerHTML = W.LOGO_MARK;
  var PHONE_ICON = '<svg width="16" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg>';
  var LAPTOP_ICON = '<svg width="20" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>';
  document.getElementById('v-phone').innerHTML = PHONE_ICON + ' Phone';
  document.getElementById('v-laptop').innerHTML = LAPTOP_ICON + ' Laptop';

  var params = new URLSearchParams(location.search);
  var ok = /^[a-z][a-z0-9_-]*\.html(\?[^#]*)?$/;
  var cur = params.get('p') || 'login.html';
  if (!ok.test(cur) || /^index\.html/.test(cur)) cur = 'login.html';
  var view = params.get('view') || W.store.get('view', 'phone');
  if (view !== 'laptop') view = 'phone';
  var frame, lastTitle = '', lastItems = [];
  var USERS = ['nur.aisyah', 'ravi.kumar', 'marcus.tan', 'rachel.lim', 'jason.ong'];
  var HOMEPAGE = { staff: 'staff-schedule.html', manager: 'manager-overview.html', admin: 'admin-accounts.html' };

  function clean(p) { return p.replace(/([?&])r=\d+&?/, '$1').replace(/[?&]$/, ''); }
  function load(p) { frame.src = p + (p.indexOf('?') >= 0 ? '&' : '?') + 'r=' + Date.now(); }

  /* ---- device frame ---- */
  function buildDevice() {
    var d = document.getElementById('device'), stage = document.getElementById('main');
    stage.classList.toggle('is-laptop', view === 'laptop');
    document.querySelectorAll('[data-view]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-view') === view)); });
    if (view === 'phone') {
      document.getElementById('dev-title').textContent = 'Mobile view';
      document.getElementById('dev-sub').textContent = 'Phone screen · 390 × 760';
      d.innerHTML = '<div class="phone" role="region" aria-label="Phone preview"><div class="screen">' +
        '<div class="status" aria-hidden="true"><span>10:42</span><span class="notch"></span><span class="icons">' +
        '<svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1"/></svg>' +
        '<svg width="24" height="12" viewBox="0 0 24 12"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="#fff"/><rect x="2" y="2" width="14" height="8" rx="1.5" fill="#fff"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="#fff"/></svg></span></div>' +
        '<iframe id="app" title="WMS app on a phone"></iframe><div class="home" aria-hidden="true"><span></span></div></div></div>';
    } else {
      document.getElementById('dev-title').textContent = 'Laptop view';
      document.getElementById('dev-sub').textContent = 'Laptop screen · 1280 × 800';
      d.innerHTML = '<div class="laptop" role="region" aria-label="Laptop preview"><div class="lid"><span class="cam" aria-hidden="true"></span>' +
        '<div class="lscreen" id="lscreen"><div class="lscreen-in" id="lin"><iframe id="app" title="WMS app on a laptop"></iframe></div></div></div><div class="base" id="base" aria-hidden="true"></div></div>';
      fitLaptop();
    }
    frame = document.getElementById('app');
    load(cur);
  }
  function fitLaptop() {
    if (view !== 'laptop') return;
    var col = document.querySelector('.device-col'), avail = col.clientWidth - 28;
    var s = Math.min(1, avail / 1280);
    var sc = document.getElementById('lscreen'), inn = document.getElementById('lin'), base = document.getElementById('base');
    inn.style.transform = 'scale(' + s + ')';
    sc.style.width = Math.round(1280 * s) + 'px'; sc.style.height = Math.round(800 * s) + 'px';
    base.style.width = Math.round(1280 * s + 28 + 60) + 'px';
    document.getElementById('dev-sub').textContent = 'Laptop screen · 1280 × 800' + (s < 1 ? ' · shown at ' + Math.round(s * 100) + '%' : '');
  }
  window.addEventListener('resize', fitLaptop);
  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = b.getAttribute('data-view'); if (v === view) return;
      view = v; W.store.set('view', view); buildDevice();
    });
  });

  /* ---- view as ---- */
  function renderPersona() {
    var key = (W.currentUser() || {}).key;
    document.getElementById('persona').innerHTML = USERS.map(function (k) {
      var p = W.PERSONAS[k];
      return '<button type="button" class="btn" data-u="' + k + '" aria-pressed="' + (k === key) + '">' + p.name + '<small>' + p.role + '</small></button>';
    }).join('');
    document.querySelectorAll('[data-u]').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-u'), g = W.PERSONAS[k].group;
        W.login(k); renderPersona();
        var keep = cur.indexOf(g === 'staff' ? 'staff-' : g + '-') === 0;
        load(keep ? cur : HOMEPAGE[g]);
      });
    });
  }

  /* ---- this screen's controls (sent by the page inside the device) ---- */
  function renderControls(title, items) {
    lastTitle = title; lastItems = items || [];
    document.getElementById('scr').textContent = title || '';
    var el = document.getElementById('page-ctrls');
    if (!lastItems.length) { el.innerHTML = '<p class="hint">No extra states for this screen.</p>'; return; }
    el.innerHTML = lastItems.map(function (it) {
      return '<button type="button" class="btn" data-id="' + it.id + '"' + (it.pressed === null ? '' : ' aria-pressed="' + it.pressed + '"') + '>' + W.esc(it.label) + '</button>';
    }).join('');
    el.querySelectorAll('[data-id]').forEach(function (b) {
      b.addEventListener('click', function () { frame.contentWindow.postMessage({ type: 'wms-run', id: +b.getAttribute('data-id') }, '*'); });
    });
  }
  window.addEventListener('message', function (e) {
    if (!frame || e.source !== frame.contentWindow) return;
    var d = e.data || {};
    if (d.type === 'wms-page') {
      cur = clean(d.path); renderControls(d.title, []); renderPersona();
      try { history.replaceState(null, '', 'index.html?p=' + encodeURIComponent(cur)); } catch (err) { /* some browsers refuse on local files */ }
    }
    if (d.type === 'wms-controls') renderControls(d.title, d.items);
  });

  document.getElementById('idle').addEventListener('click', function () { load('session-expired.html'); });
  document.getElementById('reset').addEventListener('click', function () {
    var k = (W.currentUser() || {}).key; W.store.clearAll(); if (k) W.login(k); W.store.set('view', view);
    load(cur); W.toast('Prototype data reset.');
  });
  document.getElementById('logout').addEventListener('click', function () { W.logout(); renderPersona(); load('login.html'); });

  renderPersona();
  buildDevice();
})();
</script>
</body>
</html>
