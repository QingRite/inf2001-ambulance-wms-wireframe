<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff app (mobile preview) – WMS</title>
<link rel="stylesheet" href="assets/wms.css">
<style>
  /* Staff pages are shown inside a phone (left) with the prototype controls beside it (right). */
  body { min-height: 100vh; }
  .dp-head { background: var(--brand); color: #fff; }
  .dp-head-in { max-width: 1100px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
  .dp-head .logo-text small { color: #c5d5ea; }
  .dp-head .tag { margin-left: auto; font-size: 13px; color: #c5d5ea; }
  .stage { max-width: 1100px; margin: 28px auto; padding: 28px; display: flex; gap: 40px; align-items: flex-start; justify-content: center; flex-wrap: wrap;
    background: #fff; border: 1.5px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); width: calc(100% - 48px); }

  .phone { width: 414px; flex: none; background: #0f1720; border-radius: 48px; padding: 12px; box-shadow: 0 24px 50px rgba(11, 30, 55, .35); position: relative; }
  .screen { background: var(--page); border-radius: 36px; overflow: hidden; position: relative; }
  .status { height: 34px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 13px; font-weight: 600; }
  .status .notch { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); width: 110px; height: 24px; background: #0f1720; border-radius: 14px; }
  .status .icons { display: inline-flex; gap: 6px; align-items: center; }
  iframe#app { display: block; width: 390px; height: 760px; border: 0; background: var(--page); }
  .home { height: 26px; background: #fff; display: flex; align-items: center; justify-content: center; border-top: 1px solid var(--line-2); }
  .home span { width: 120px; height: 5px; border-radius: 3px; background: #1a2430; }

  .panel { flex: 1 1 320px; max-width: 420px; }
  .panel h2 { margin-bottom: 4px; }
  .panel section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 16px; }
  .panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .panel .btns { display: flex; flex-direction: column; gap: 8px; }
  .panel .btn { justify-content: flex-start; text-align: left; width: 100%; }
  .panel .btn[aria-pressed="true"] { background: var(--brand-tint); border-color: var(--brand-2); color: var(--brand); }
  .panel .btn[aria-pressed="true"]::after { content: "On"; margin-left: auto; font-size: 12px; background: var(--brand-2); color: #fff; padding: 1px 8px; border-radius: 999px; }
  .persona { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .persona .btn { flex-direction: column; align-items: flex-start; gap: 0; padding: 8px 10px; }
  .persona .btn small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .persona .btn[aria-pressed="true"]::after { content: none; }
  .persona .btn[aria-pressed="true"] { border-width: 2px; }
  .screen-name { font-weight: 700; color: var(--brand); text-transform: none; letter-spacing: 0; font-size: 15px; }

  @media (max-width: 900px) {
    .stage { width: 100%; margin: 0; border-radius: 0; border: none; padding: 12px; gap: 16px; }
    .phone { width: 100%; max-width: 414px; padding: 8px; border-radius: 36px; }
    iframe#app { width: 100%; height: 72vh; }
    .panel { max-width: none; }
  }
</style>
</head>
<body>
<header class="dp-head"><div class="dp-head-in">
  <span id="mark"></span><span class="logo-text"><strong>WMS</strong><small>Staff app · mobile preview</small></span>
  <span class="tag">Prototype</span>
</div></header>

<main class="stage" id="main">
  <div class="phone" role="region" aria-label="Phone preview of the staff app">
    <div class="screen">
      <div class="status" aria-hidden="true"><span>10:42</span><span class="notch"></span><span class="icons" id="sicons"></span></div>
      <iframe id="app" title="WMS staff app"></iframe>
      <div class="home" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <aside class="panel card" aria-labelledby="pc-h">
    <h2 id="pc-h">Prototype controls</h2>
    <p class="hint">Not part of the app. Use these to show other users and states for screenshots. Everything inside the phone is the real design.</p>

    <section aria-labelledby="as-h">
      <h3 id="as-h">View as</h3>
      <div class="persona" id="persona"></div>
    </section>

    <section aria-labelledby="scr-h">
      <h3 id="scr-h">This screen: <span class="screen-name" id="scr"></span></h3>
      <div class="btns" id="page-ctrls"></div>
    </section>

    <section aria-labelledby="gen-h">
      <h3 id="gen-h">Any screen</h3>
      <div class="btns">
        <button class="btn" type="button" id="idle">Simulate 15 min idle (NFR-11)</button>
        <button class="btn" type="button" id="reset">Reset prototype data</button>
        <button class="btn" type="button" id="logout">Log out</button>
      </div>
    </section>
  </aside>
</main>

<script src="assets/wms.js"></script>
<script>
(function () {
  var W = WMS;
  document.getElementById('mark').innerHTML = W.LOGO_MARK;
  document.getElementById('sicons').innerHTML =
    '<svg width="16" height="12" viewBox="0 0 16 12" fill="#fff" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1"/></svg>' +
    '<svg width="24" height="12" viewBox="0 0 24 12" aria-hidden="true"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="#fff"/><rect x="2" y="2" width="14" height="8" rx="1.5" fill="#fff"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="#fff"/></svg>';

  var frame = document.getElementById('app');
  var STAFF = ['nur.aisyah', 'ravi.kumar', 'marcus.tan'];
  var ok = /^(staff-[a-z]+\.html|session-expired\.html)(\?[^#]*)?$/;
  var cur = new URLSearchParams(location.search).get('p') || 'staff-schedule.html';
  if (!ok.test(cur)) cur = 'staff-schedule.html';
  var u = W.currentUser();
  if (!u || STAFF.indexOf(u.key) < 0) W.login('nur.aisyah');

  function clean(p) { return p.replace(/([?&])r=\d+&?/, '$1').replace(/[?&]$/, ''); }
  function load(p) { frame.src = p + (p.indexOf('?') >= 0 ? '&' : '?') + 'r=' + Date.now(); }

  function renderPersona() {
    var key = (W.currentUser() || {}).key;
    document.getElementById('persona').innerHTML = STAFF.map(function (k) {
      var p = W.PERSONAS[k];
      return '<button type="button" class="btn" data-u="' + k + '" aria-pressed="' + (k === key) + '">' + p.name + '<small>' + p.role + '</small></button>';
    }).join('');
    document.querySelectorAll('[data-u]').forEach(function (b) {
      b.addEventListener('click', function () { W.login(b.getAttribute('data-u')); renderPersona(); load(cur === 'session-expired.html' ? 'staff-schedule.html' : cur); });
    });
  }
  function renderControls(title, items) {
    document.getElementById('scr').textContent = title || '';
    var el = document.getElementById('page-ctrls');
    if (!items || !items.length) { el.innerHTML = '<p class="hint">No extra states for this screen.</p>'; return; }
    el.innerHTML = items.map(function (it) {
      return '<button type="button" class="btn" data-id="' + it.id + '"' + (it.pressed === null ? '' : ' aria-pressed="' + it.pressed + '"') + '>' + W.esc(it.label) + '</button>';
    }).join('');
    el.querySelectorAll('[data-id]').forEach(function (b) {
      b.addEventListener('click', function () { frame.contentWindow.postMessage({ type: 'wms-run', id: +b.getAttribute('data-id') }, '*'); });
    });
  }

  /* messages from the page inside the phone */
  window.addEventListener('message', function (e) {
    if (e.source !== frame.contentWindow) return;
    var d = e.data || {};
    if (d.type === 'wms-page') {
      cur = clean(d.path); renderControls(d.title, []); renderPersona();
      try { history.replaceState(null, '', 'staff-app.html?p=' + encodeURIComponent(cur)); } catch (err) { /* file pages may refuse */ }
    }
    if (d.type === 'wms-controls') renderControls(d.title, d.items);
  });

  document.getElementById('idle').addEventListener('click', function () { frame.src = 'session-expired.html'; });
  document.getElementById('reset').addEventListener('click', function () {
    var k = (W.currentUser() || {}).key || 'nur.aisyah'; W.store.clearAll(); W.login(k);
    load(cur === 'session-expired.html' ? 'staff-schedule.html' : cur); W.toast('Prototype data reset.');
  });
  document.getElementById('logout').addEventListener('click', function () { W.logout(); location.href = 'index.html'; });

  renderPersona();
  load(cur);
})();
</script>
</body>
</html>
