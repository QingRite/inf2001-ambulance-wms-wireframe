<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page name – WMS</title>
<link rel="stylesheet" href="assets/wms.css">
</head>
<!-- 1. Copy this file and rename it, e.g. manager-allocation.html
     2. Set data-group (staff | manager | admin) and data-active (the nav key in assets/wms.js NAV)
     3. In assets/wms.js NAV, add (or update) the entry for this page with your file name -->
<body data-group="manager" data-active="manager-allocation">
<main id="main">
  <!-- Fig 5.x.y Name (FR-xx). UC-xx. -->
  <div class="page-head">
    <div>
      <h1>Page title</h1>
      <p class="sub">One line on what this page is for.</p>
    </div>
  </div>
  <div id="flash"></div>

  <div class="row">
    <section class="col-main card">
      <h2>Main content</h2>
      <p>Replace with your page.</p>
      <div class="actions"><button class="btn">Cancel</button><button class="btn primary" id="go">Main action</button></div>
    </section>
    <aside class="col-side card">
      <h2>Side panel</h2>
      <p class="muted">Optional.</p>
    </aside>
  </div>
</main>

<script src="assets/wms.js"></script>
<script>
(function () {
  var W = WMS, me = W.currentUser();
  document.getElementById('go').addEventListener('click', function () {
    W.modal({ title: 'Confirm?', html: '<p>Example pop-up.</p>', actions: [{ label: 'Cancel' }, { label: 'Confirm', primary: true }] });
  });
  W.controls([]);   // add page-specific prototype controls here
})();
</script>
</body>
</html>
