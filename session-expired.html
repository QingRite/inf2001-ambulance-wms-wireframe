<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session expired – WMS</title>
<link rel="stylesheet" href="assets/wms.css">
<style>
  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { text-align: center; }
  .auth-brand { justify-content: center; }
  .ic { display: inline-flex; width: 60px; height: 60px; background: var(--brand-tint); color: var(--brand-2); border-radius: 50%; align-items: center; justify-content: center; margin-bottom: 12px; }
</style>
</head>
<body class="auth">
<main id="main" class="wrap">
  <!-- NFR-11: inactive mobile session ends after 15 minutes -->
  <div class="auth-card">
    <div class="auth-brand"><span id="mark"></span><span class="logo-text"><strong>WMS</strong><small>Ambulance Workforce</small></span></div>
    <span class="ic" id="ic"></span>
    <h1>Session expired</h1>
    <p class="sub">You were inactive for 15 minutes, so you have been logged out to protect patient and staff data.</p>
    <a class="btn primary" href="index.html" target="_top" style="width:100%">Log in again</a>
  </div>
</main>
<script src="assets/wms.js"></script>
<script>
  document.getElementById('ic').innerHTML = WMS.ICONS.lock.replace(/18/g, '26');
  document.getElementById('mark').innerHTML = WMS.LOGO_MARK;
  WMS.logout();
</script>
</body>
</html>
