<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave Records – WMS</title>
<link rel="stylesheet" href="assets/wms.css">
<style>
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0 12px; align-items: end; }
  .conf { font-size: 12px; color: var(--muted); }
</style>
</head>
<body data-group="manager" data-active="manager-leave">
<main id="main">
  <!-- Fig 5.6.1 Record absence – Manager (FR-23), 5.6.6 Consolidated leave records (FR-36, FR-41). UC-05, UC-15. -->
  <div class="page-head">
    <div><h1>Leave Records</h1><p class="sub">Leave, medical certificates and unavailability notes for all staff. Reasons and certificates are visible to Managers only.</p></div>
    <button class="btn primary" id="add" type="button">Record absence</button>
  </div>
  <div id="flash"></div>
  <form class="card filters" id="filters" style="margin-bottom:16px">
    <div class="field"><label for="from">From</label><input type="date" id="from" value="2026-11-30"></div>
    <div class="field"><label for="to">To</label><input type="date" id="to" value="2026-12-31"></div>
    <div class="field"><label for="cat">Leave category</label><select id="cat"><option value="">All categories</option><option>Medical Leave</option><option>Emergency Leave</option><option>Annual Leave</option><option>Other</option></select></div>
    <div class="field"><label for="name">Staff name or ID</label><input type="text" id="name"></div>
  </form>
  <div class="table-wrap"><table><thead><tr><th>Staff</th><th>Category</th><th>Dates</th><th>Reason <span class="conf">(confidential)</span></th><th>Medical certificate</th><th>Recorded</th></tr></thead><tbody id="rows"></tbody></table></div>
  <p class="muted small" id="count" style="margin-top:8px"></p>
</main>
<script src="assets/wms.js"></script>
<script src="assets/wms-roster.js"></script>
<script>
(function () {
  var W = WMS, R = W.R;
  function render() {
    var f = document.getElementById('from').value, t = document.getElementById('to').value, c = document.getElementById('cat').value, q = document.getElementById('name').value.trim().toLowerCase();
    var list = R.leaves().filter(function (l) {
      var s = R.BY_ID[l.staff] || { name: l.staff, id: l.staff };
      return (!f || l.end >= f) && (!t || l.start <= t) && (!c || l.cat === c) && (!q || (s.name + ' ' + s.id).toLowerCase().indexOf(q) >= 0);
    }).sort(function (a, b) { return a.start < b.start ? -1 : 1; });
    document.getElementById('rows').innerHTML = list.map(function (l) {
      var s = R.BY_ID[l.staff] || { name: l.staff, role: '', id: l.staff };
      return '<tr><td><strong>' + s.name + '</strong><span class="small muted" style="display:block">' + s.role + ' · ' + s.id + '</span></td><td>' + l.cat + '</td>' +
        '<td>' + W.fmtDate(l.start) + (l.end !== l.start ? ' – ' + W.fmtDate(l.end) : '') + '</td><td>' + W.esc(l.reason) + '</td>' +
        '<td>' + (l.mc ? '<button class="btn small" data-mc="' + l.id + '">View MC</button>' : '<span class="muted">None</span>') + '</td>' +
        '<td>' + W.esc(l.by) + '<span class="small muted" style="display:block">' + W.fmtDate(l.recorded, { noDay: true }) + '</span></td></tr>';
    }).join('') || '<tr><td colspan="6" class="muted">No records match these filters.</td></tr>';
    document.getElementById('count').textContent = list.length + ' records.';
    document.querySelectorAll('[data-mc]').forEach(function (b) {
      b.addEventListener('click', function () {
        var l = R.leaves().filter(function (x) { return x.id === b.getAttribute('data-mc'); })[0];
        W.modal({ title: 'Medical certificate – ' + R.staffName(l.staff), html: '<div class="ph-img" style="height:220px;border-radius:6px" role="img" aria-label="Medical certificate image placeholder"></div><p class="hint" style="margin-top:8px">' + l.cat + ', ' + W.fmtDate(l.start, { noDay: true }) + ' – ' + W.fmtDate(l.end, { noDay: true, year: true }) + '. Visible to Managers only.</p>', actions: [{ label: 'Close', primary: true }] });
      });
    });
  }
  ['from', 'to', 'cat'].forEach(function (id) { document.getElementById(id).addEventListener('change', render); });
  document.getElementById('name').addEventListener('input', render);
  document.getElementById('filters').addEventListener('submit', function (e) { e.preventDefault(); });

  /* FR-23: Manager records an absence for a staff member */
  document.getElementById('add').addEventListener('click', function () {
    var opts = R.STAFF.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (s) { return '<option value="' + s.id + '">' + s.name + ' (' + s.id + ', ' + s.role + ')</option>'; }).join('');
    W.modal({ title: 'Record absence', html: '<p class="hint" style="margin-top:0">Fields marked * are required.</p><div class="form-summary"></div>' +
      '<div class="field"><label for="a-staff">Staff member<span class="req" aria-hidden="true">*</span></label><select id="a-staff"><option value="">Select a staff member</option>' + opts + '</select></div>' +
      '<div class="field"><label for="a-cat">Absence category<span class="req" aria-hidden="true">*</span></label><select id="a-cat"><option value="">Select a category</option><option>Medical Leave</option><option>Emergency Leave</option><option>Annual Leave</option><option>Other</option></select></div>' +
      '<div class="grid-2"><div class="field"><label for="a-start">Start date<span class="req" aria-hidden="true">*</span></label><input type="date" id="a-start"></div><div class="field"><label for="a-end">End date<span class="req" aria-hidden="true">*</span></label><input type="date" id="a-end"></div></div>' +
      '<div class="field"><label for="a-desc">Description</label><textarea id="a-desc"></textarea></div>' +
      '<div class="field"><label for="a-mc">Medical certificate</label><input type="file" id="a-mc" accept=".pdf,.jpg,.png"></div>',
      actions: [{ label: 'Cancel' }, { label: 'Record absence', primary: true, onClick: function (o) {
        W.clearErrors(o);
        var st = o.querySelector('#a-staff'), cat = o.querySelector('#a-cat'), s = o.querySelector('#a-start'), e = o.querySelector('#a-end'), miss = [];
        if (!st.value) W.setError(st, 'Select the staff member.');
        if (!cat.value) W.setError(cat, 'Select an absence category.');
        if (!s.value) { W.setError(s, 'Enter a start date.'); miss.push('start date'); }
        if (!e.value) { W.setError(e, 'Enter an end date.'); miss.push('end date'); }
        if (s.value && e.value && e.value < s.value) W.setError(e, 'End date must be on or after the start date.');
        if (o.querySelector('[aria-invalid]')) { W.summary(o, miss.length ? 'Submission denied – missing ' + miss.join(' and ') + '.' : 'Submission denied. Fix the fields marked below.'); o.querySelector('[aria-invalid]').focus(); return true; }
        var list = W.store.get('mgr.leave', []);
        list.unshift({ id: 'L-M' + (list.length + 1), staff: st.value, cat: cat.value, start: s.value, end: e.value, reason: o.querySelector('#a-desc').value.trim() || '–', mc: o.querySelector('#a-mc').files.length > 0, by: 'Rachel Lim', recorded: W.TODAY });
        W.store.set('mgr.leave', list);
        /* rostered shifts in the period become unstaffed positions for Swaps & Stand-ins */
        var r = R.roster(), hit = R.seatsOf(st.value, r).filter(function (x) { var d = R.SLOTS[x.slot].date; return d >= s.value && d <= e.value; });
        if (hit.length) {
          var rej = R.rejections();
          hit.forEach(function (x) { r[x.slot][x.amb][x.seat] = null; rej.push({ staff: st.value, slot: x.slot, amb: x.amb, seat: x.seat, reason: cat.value + ' recorded by Manager.', why: cat.value }); });
          R.saveRoster(r); W.store.set('mgr.rejections', rej);
        }
        W.audit('Absence recorded', R.staffLabel(st.value), '–', cat.value + ' ' + W.fmtDate(s.value, { noDay: true }) + ' – ' + W.fmtDate(e.value, { noDay: true }));
        document.getElementById('flash').innerHTML = '<div class="banner ok" role="status">' + W.ICONS.check + '<p><strong>Absence recorded for ' + W.esc(R.staffName(st.value)) + '.</strong> ' +
          (hit.length ? hit.length + ' rostered shift(s) are now unstaffed. <a href="manager-swaps.html">Find stand-ins</a>' : 'No rostered shifts are affected.') + '</p></div>';
        render();
      } }] });
  });
  render();
  W.controls([{ label: 'Reset manager-recorded leave', onClick: function () { W.store.set('mgr.leave', []); render(); } }]);
})();
</script>
</body>
</html>
